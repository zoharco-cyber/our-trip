name: שמירה על האתר ער
# ב-Supabase החינמי, פרויקט בלי פעילות שבוע נכנס להשהיה.
# הפעולה הזו פונה למסד הנתונים פעם ביום, כדי שזה לא יקרה.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: פנייה למסד הנתונים
        run: |
          set -a; . ./.env.production; set +a
          code=$(curl -s -o /dev/null -w '%{http_code}' "$VITE_SUPABASE_URL/rest/v1/events?select=id&limit=1" \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY")
          echo "status: $code"
          test "$code" = "200"
